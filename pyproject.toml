[project]
name = "tbot"
version = "0.1.0"
description = "Personal AI self-improvement assistant via Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "openai>=1.50",
    "pydantic-settings>=2.0",
    "tiktoken>=0.7",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "httpx>=0.27",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
