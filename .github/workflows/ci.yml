name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tbot
          POSTGRES_PASSWORD: tbot
          POSTGRES_DB: tbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbot -d tbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://tbot:tbot@localhost:5432/tbot
        run: alembic upgrade head

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://tbot:tbot@localhost:5432/tbot
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -q
